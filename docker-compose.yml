version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ercs_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ercs
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ercs_net

  backend:
    build:
      context: ./backend
    container_name: ercs_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: ercs
      JWT_SECRET: local_test_secret_do_not_use_in_prod
    volumes:
      - upload_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - ercs_net

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=/api
        - VITE_SOCKET_URL=/
    container_name: ercs_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - ercs_net

volumes:
  db_data:
  upload_data:

networks:
  ercs_net:
    driver: bridge
